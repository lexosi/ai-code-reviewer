[package]
name = "ai-code-reviewer"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Post-commit git hook that sends the latest commit diff to the Claude API for review and delivers it to Telegram."

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
reqwest = { version = "0.12", features = ["blocking", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
